[package]
name = "mx44-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "A modern four-operator matrix synthesizer inspired by Mx44"

[workspace]
members = ["plugins/nih", "xtask"]
default-members = ["."]
resolver = "2"

[features]
default = ["standalone"]
standalone = ["dep:clap", "dep:cpal", "dep:ctrlc", "dep:eframe", "dep:hound", "dep:midir", "dep:rtrb", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[[bin]]
name = "mx44-rust"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
cpal = { version = "0.16", optional = true }
ctrlc = { version = "3", optional = true }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
hound = { version = "3.5", optional = true }
midir = { version = "0.10", optional = true }
rand = "0.9"
rtrb = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"], optional = true }

[dev-dependencies]
hound = "3.5"

[profile.release]
lto = "thin"
codegen-units = 1
